name: Update CodeChef & GFG Stats

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, 00:00 UTC (~6:00 AM Dhaka time)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Generate stats SVGs
        run: python scripts/generate_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/codechef.svg profile/gfg.svg
          git diff --staged --quiet || git commit -m "Update CodeChef & GFG stats [automated]"
          git push
